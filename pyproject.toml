[project]
name = "wakeforge"
version = "0.0.1"
description = "Train your own custom wake word at home in minutes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["wake-word", "hotword", "keyword-spotting", "speech", "tts", "onnx"]
dependencies = [
    "numpy",
    "torch",
    "torchaudio",
    "onnx",
    "onnxruntime",
    "sounddevice",
    "soundfile",
    "typer",
]

[project.optional-dependencies]
tts = ["piper-tts"]
dev = ["pytest", "ruff"]

[project.scripts]
wakeforge = "wakeforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wakeforge"]

[tool.ruff]
line-length = 100


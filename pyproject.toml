[project]
name = "wakeforge"
version = "0.0.1"
description = "Train your own custom wake word at home in minutes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["wake-word", "hotword", "keyword-spotting", "speech", "tts", "onnx"]

dependencies = [
    "numpy>=2.0",
    "torch>=2.4",
    "torchaudio>=2.4",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "typer>=0.12",
]

[project.optional-dependencies]
record = [
    "numpy>=2.0",
    "scipy>=1.13",
    "sounddevice>=0.5",
    "soundfile>=0.12",
]

dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
wakeforge = "wakeforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wakeforge"]

[tool.ruff]
line-length = 100